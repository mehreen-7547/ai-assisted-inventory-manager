
{% extends 'base.html' %}

{% block content %}

{% if form.instance.pk %}
    <h2>Edit Supplier</h2>
{% else %}
    <h2>Add Supplier</h2>
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    {% if form.instance.pk %}
        <button type="submit" class="btn btn-primary">
            Update Supplier
        </button>

        <a href="{% url 'supplier_list' %}"
           class="btn btn-outline-secondary">
            Cancel
        </a>
    {% else %}
        <button type="submit" class="btn btn-primary">
            Save Supplier
        </button>
    {% endif %}
</form>

<p class="mt-3">
    <a href="{% url 'supplier_list' %}">
        Back to Suppliers
    </a>
</p>

{% endblock %}
