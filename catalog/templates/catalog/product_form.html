
{% extends 'base.html' %}

{% block title %}Product Form - Inventory System{% endblock %}

{% block content %}

{% if form.instance.pk %}
    <h2 class="mb-4">Edit Product</h2>
{% else %}
    <h2 class="mb-4">Add Product</h2>
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    {% if form.instance.pk %}
        <button type="submit" class="btn btn-primary">
            Update Product
        </button>
    {% else %}
        <button type="submit" class="btn btn-primary">
            Save Product
        </button>
    {% endif %}

    <a href="{% url 'product_list' %}"
       class="btn btn-outline-secondary">
        Cancel
    </a>
</form>

{% endblock %}
